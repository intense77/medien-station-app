<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Zauber Selfie</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/assets/logo.png">
    <link rel="apple-touch-icon" href="/assets/logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="stylesheet" href="../css/style.css">
    <script src="../cordova.js"></script>
    <script src="../js/audio.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/print.js"></script>
    
    <script src="../js/selfie_segmentation.js"></script>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        body { 
            background-color: #0f172a; 
            color: white; 
            user-select: none; 
            touch-action: manipulation; 
        }

        video, canvas { display: block; border-radius: inherit; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Optimierung für Smartphone Querformat */
        @media (max-height: 500px) and (orientation: landscape) {
            .header-area { height: 3.5rem !important; margin-bottom: 0 !important; }
            .side-bar { width: 4.5rem !important; padding: 0.25rem !important; gap: 0.5rem !important; }
            .side-btn { height: 3.5rem !important; width: 3.5rem !important; font-size: 1.5rem !important; }
            .action-area { height: 4.5rem !important; flex-direction: row !important; gap: 1rem !important; }
            .video-main { border-width: 4px !important; }
        }
        
        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .animate-pop { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .font-comic { font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif; }
        
        /* Filter-Buttons */
        .filter-btn {
            transition: all 0.2s ease-in-out;
        }
        .filter-btn.active {
            border-color: #a855f7 !important; /* purple-500 */
            background-color: #a855f7 !important;
            color: white !important;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
            transform: scale(1.05);
        }
    </style>
</head>
<body class="flex flex-col p-2 md:p-4 box-border bg-slate-900">

    <div class="header-area h-16 md:h-20 flex-none flex justify-between items-center z-50 mb-2 md:mb-4 px-1 relative">
        <button onclick="window.goHome()" class="bg-slate-800 text-white border-2 md:border-4 border-slate-600 hover:border-white px-3 py-2 md:px-6 md:py-3 rounded-full text-xs md:text-xl font-black shadow-xl flex items-center gap-1 md:gap-3 transition-transform active:scale-95 no-underline focus:outline-none shrink-0 z-50">
            🏠 <span class="hidden md:inline">MENÜ</span>
        </button>

        <h1 class="hidden md:block absolute left-1/2 -translate-x-1/2 top-1/2 -translate-y-1/2 text-2xl lg:text-5xl font-black text-purple-400 tracking-wider drop-shadow-lg pointer-events-none z-10 uppercase">
            ZAUBER SELFIE
        </h1>

        <button onclick="window.toggleInfo()" class="w-10 h-10 md:w-14 md:h-14 bg-slate-800 text-white rounded-full font-bold border-2 md:border-4 border-slate-600 hover:border-white shadow-xl flex items-center justify-center transition-transform active:scale-95 text-lg md:text-2xl shrink-0 z-50">
            ?
        </button>
    </div>

    <div class="flex-1 flex flex-col md:flex-row landscape:flex-row gap-2 md:gap-4 min-h-0 w-full max-w-[95rem] mx-auto overflow-hidden">
        
        <div class="side-bar flex-none w-full md:w-32 bg-slate-800 p-2 md:p-3 rounded-xl md:rounded-[2rem] border-4 border-slate-700 shadow-2xl flex flex-row md:flex-col gap-2 overflow-x-auto md:overflow-y-auto no-scrollbar items-center justify-start h-auto md:h-full">
            <button onclick="window.setBg('real', this)" class="bg-btn side-btn ring-4 ring-yellow-400 flex-none w-16 h-16 md:w-full md:h-20 rounded-xl bg-slate-700 border-2 border-white text-2xl md:text-4xl shadow-md active:scale-95 transition flex items-center justify-center" title="Realer Hintergrund">📷</button>
            <button onclick="window.setBg('space', this)" class="bg-btn side-btn flex-none w-16 h-16 md:w-full md:h-20 rounded-xl bg-indigo-900 border-2 border-white text-2xl md:text-4xl shadow-md active:scale-95 transition flex items-center justify-center">🚀</button>
            <button onclick="window.setBg('jungle', this)" class="bg-btn side-btn flex-none w-16 h-16 md:w-full md:h-20 rounded-xl bg-emerald-900 border-2 border-white text-2xl md:text-4xl shadow-md active:scale-95 transition flex items-center justify-center">🌴</button>
            <button onclick="window.setBg('underwater', this)" class="bg-btn side-btn flex-none w-16 h-16 md:w-full md:h-20 rounded-xl bg-blue-900 border-2 border-white text-2xl md:text-4xl shadow-md active:scale-95 transition flex items-center justify-center">🐙</button>
            <button onclick="window.setBg('paris', this)" class="bg-btn side-btn flex-none w-16 h-16 md:w-full md:h-20 rounded-xl bg-pink-900 border-2 border-white text-2xl md:text-4xl shadow-md active:scale-95 transition flex items-center justify-center">🗼</button>
            <button onclick="window.setBg('wolken', this)" class="bg-btn side-btn flex-none w-16 h-16 md:w-full md:h-20 rounded-xl bg-sky-900 border-2 border-white text-2xl md:text-4xl shadow-md active:scale-95 transition flex items-center justify-center">☁️</button>
            <button onclick="window.setBg('schloss', this)" class="bg-btn side-btn flex-none w-16 h-16 md:w-full md:h-20 rounded-xl bg-purple-900 border-2 border-white text-2xl md:text-4xl shadow-md active:scale-95 transition flex items-center justify-center">🏰</button>
            <button onclick="window.setBg('dino', this)" class="bg-btn side-btn flex-none w-16 h-16 md:w-full md:h-20 rounded-xl bg-orange-900 border-2 border-white text-2xl md:text-4xl shadow-md active:scale-95 transition flex items-center justify-center">🦖</button>
            <button onclick="window.setBg('stadion', this)" class="bg-btn side-btn flex-none w-16 h-16 md:w-full md:h-20 rounded-xl bg-green-900 border-2 border-white text-2xl md:text-4xl shadow-md active:scale-95 transition flex items-center justify-center">⚽</button>
        </div>

        <div class="flex-1 flex flex-col min-h-0 w-full gap-2">
            <div class="video-main relative flex-1 min-h-0 w-full bg-slate-800 rounded-[1.5rem] md:rounded-[2.5rem] overflow-hidden border-4 md:border-[8px] border-slate-700 shadow-2xl flex items-center justify-center">
                <video id="video" autoplay playsinline muted class="absolute w-[1px] h-[1px] opacity-0 pointer-events-none z-[-1]"></video>

                <div id="loading-ai" class="absolute inset-0 bg-slate-900 flex flex-col items-center justify-center z-40">

                </div>
            </div>

            <div class="action-area h-24 md:h-36 flex-none shrink-0 w-full flex flex-col items-center justify-center gap-2 px-2">
                <!-- Filter-Auswahl -->
                <div class="flex items-center gap-1.5 max-w-full overflow-x-auto no-scrollbar py-0.5">
                    <button onclick="window.setFilter('none', this)" class="filter-btn active px-3 py-1 rounded-full text-xs md:text-sm font-black border border-slate-700 bg-slate-800 text-slate-300 hover:text-white focus:outline-none">🌈 Normal</button>
                    <button onclick="window.setFilter('grayscale', this)" class="filter-btn px-3 py-1 rounded-full text-xs md:text-sm font-black border border-slate-700 bg-slate-800 text-slate-300 hover:text-white focus:outline-none">⚫ S/W</button>
                    <button onclick="window.setFilter('sepia', this)" class="filter-btn px-3 py-1 rounded-full text-xs md:text-sm font-black border border-slate-700 bg-slate-800 text-slate-300 hover:text-white focus:outline-none">🟤 Sepia</button>
                    <button onclick="window.setFilter('warm', this)" class="filter-btn px-3 py-1 rounded-full text-xs md:text-sm font-black border border-slate-700 bg-slate-800 text-slate-300 hover:text-white focus:outline-none">🌅 Warm</button>
                    <button onclick="window.setFilter('cold', this)" class="filter-btn px-3 py-1 rounded-full text-xs md:text-sm font-black border border-slate-700 bg-slate-800 text-slate-300 hover:text-white focus:outline-none">❄️ Kalt</button>
                </div>

                <!-- Modus-Auswahl -->
                <div class="flex bg-slate-800 p-1 rounded-full border border-slate-700 shadow-md">
                    <button id="mode-single-btn" onclick="window.setMode('single')" class="px-2 py-1 md:px-4 md:py-1.5 rounded-full text-xs md:text-sm font-black transition-all bg-purple-600 text-white focus:outline-none">
                        👤 EINZELBILD
                    </button>
                    <button id="mode-polaroid-btn" onclick="window.setMode('polaroid')" class="px-2 py-1 md:px-4 md:py-1.5 rounded-full text-xs md:text-sm font-black transition-all text-slate-400 hover:text-white focus:outline-none">
                        🖼️ POLAROID
                    </button>
                    <button id="mode-collage-btn" onclick="window.setMode('collage')" class="px-2 py-1 md:px-4 md:py-1.5 rounded-full text-xs md:text-sm font-black transition-all text-slate-400 hover:text-white focus:outline-none">
                        📖 3ER-COLLAGE
                    </button>
                </div>
                
                <div class="flex items-center justify-center gap-3 w-full">
                    <button onclick="window.switchCamera()" class="w-10 h-10 md:w-16 md:h-16 bg-slate-700 hover:bg-slate-600 text-white rounded-xl md:rounded-2xl border-b-4 md:border-b-[6px] border-slate-900 active:translate-y-1 active:border-b-0 transition-all flex items-center justify-center shrink-0 shadow-xl" title="Kamera wechseln">
                        <span class="text-xl md:text-3xl">🔄</span>
                    </button>
                    <button id="shutter-btn" onclick="window.startCountdown()" class="flex-1 max-w-xs md:max-w-sm h-10 md:h-16 bg-purple-600 hover:bg-purple-500 text-white text-sm md:text-2xl font-black rounded-xl md:rounded-2xl border-b-4 md:border-b-[6px] border-purple-800 active:translate-y-1 active:border-b-0 transition-all flex items-center justify-center gap-2 md:gap-4 shadow-[0_0_15px_rgba(147,51,234,0.4)] hover:shadow-[0_0_30px_rgba(147,51,234,0.6)] group">
                        <span class="group-hover:scale-110 transition-transform duration-300">✨</span> ZAUBERN!
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- PREVIEW MODAL -->
    <div id="preview-overlay" class="fixed inset-0 bg-slate-900/95 backdrop-blur-sm z-[100] hidden flex-col items-center justify-center p-4 md:p-8 pb-6 md:pb-10">
        <h2 class="flex-none text-2xl md:text-4xl font-black text-white mb-4 md:mb-6">Dein Zauber Selfie!</h2>
        <div class="relative w-full max-w-[95%] lg:max-w-[80%] flex-1 min-h-0 border-4 md:border-8 border-white shadow-2xl rounded-xl md:rounded-3xl overflow-hidden bg-black flex items-center justify-center">
            <img id="preview-img-display" class="w-full h-full object-contain" src="">
        </div>
        <div class="flex-none flex flex-wrap justify-center gap-2 md:gap-6 mt-4 md:mt-8 w-full max-w-3xl px-1">
            <button onclick="window.closePreview()" class="flex-1 bg-yellow-500 text-black font-black py-3 rounded-xl text-xs md:text-2xl border-b-4 border-yellow-700 active:translate-y-1 active:border-b-0">🔄 NOCHMAL</button>
            <button onclick="window.printFromPreview(this)" class="flex-1 bg-white text-black font-black py-3 rounded-xl text-xs md:text-2xl border-b-4 border-gray-400 active:translate-y-1 active:border-b-0">🖨️ DRUCKEN</button>
            <button onclick="window.goHome()" class="flex-1 bg-slate-700 text-white font-black py-3 rounded-xl text-xs md:text-2xl border-b-4 border-slate-900 active:translate-y-1 active:border-b-0">🏠 MENÜ</button>
        </div>
    </div>

    <!-- HILFE MODAL -->
    <div id="info-modal" class="hidden fixed inset-0 z-[200] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4" onclick="window.toggleInfo()">
        <div class="bg-slate-800 border-4 border-purple-500 rounded-[2rem] max-w-2xl w-full p-8 shadow-2xl relative" onclick="event.stopPropagation()">
            <button onclick="window.toggleInfo()" class="absolute top-6 right-6 text-white hover:text-purple-400 text-4xl font-bold transition">✖</button>
            <h2 class="text-3xl md:text-4xl font-black text-white mb-8 border-b border-slate-600 pb-4 flex items-center gap-4">
                <span>✨ ANLEITUNG</span>
                <button onclick="window.speakText('Anleitung für Zauber Selfie. Wähle links einen Hintergrund. Drücke unten auf ZAUBERN. Stell dich vor die Kamera, und schwupps bist du in einer anderen Welt!', event)" class="ml-auto mr-12 md:mr-16 bg-slate-700 hover:bg-slate-600 text-white rounded-full w-10 h-10 md:w-14 md:h-14 flex items-center justify-center shadow-lg border-2 border-slate-500 active:scale-95 transition-all text-xl md:text-3xl shrink-0" title="Vorlesen">🔊</button>
            </h2>
            <div class="text-lg text-slate-300 space-y-4">
                <p>1. Wähle links einen <b>Hintergrund</b>.</p>
                <p>2. Drücke unten auf <b>ZAUBERN!</b>.</p>
                <p>3. Stell dich vor die Kamera, und schwupps bist du in einer anderen Welt!</p>
            </div>
            <button onclick="window.toggleInfo()" class="mt-8 w-full bg-purple-600 hover:bg-purple-500 text-white font-black py-4 rounded-xl text-xl transition">ALLES KLAR!</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('output_canvas');
        const ctx = canvas.getContext('2d');
        const loadingEl = document.getElementById('loading-ai');
        let currentStream, currentFacingMode = 'user', activeBg = 'real', isRunning = false;
        let mode = 'single';
        let isCapturingCollage = false;
        let collagePhotos = [];
        let activeFilter = 'none';


        const bgs = {
            space: new Image(), jungle: new Image(), underwater: new Image(),
            paris: new Image(), wolken: new Image(), schloss: new Image(),
            dino: new Image(), stadion: new Image()
        };
        bgs.space.src = '../assets/weltraum.jpg'; bgs.jungle.src = '../assets/dschungel.jpg';
        bgs.underwater.src = '../assets/unterwasser.jpg'; bgs.paris.src = '../assets/paris.jpg';
        bgs.wolken.src = '../assets/wolken.jpg'; bgs.schloss.src = '../assets/schloss.jpg';
        bgs.dino.src = '../assets/dino.jpg'; bgs.stadion.src = '../assets/stadion.jpg';

        let selfieSegmentation;

        function initMediaPipe() {
            loadingEl.style.display = 'flex';
            selfieSegmentation = new SelfieSegmentation({locateFile: (file) => `../models/${file}`});
            selfieSegmentation.setOptions({ modelSelection: 0 }); // 0 = General Model (höhere Qualität), 1 = Landscape Model (schneller)
            selfieSegmentation.onResults(onResults);
        }

        // --- ROBUSTE KAMERA ---
        async function initCam() {
            if (currentStream) currentStream.getTracks().forEach(t => t.stop());
            
            const constraints = [
                { video: { facingMode: currentFacingMode, width: { ideal: 1280 }, height: { ideal: 720 } } },
                { video: true }
            ];

            for (let c of constraints) {
                try {
                    currentStream = await navigator.mediaDevices.getUserMedia(c);
                    video.srcObject = currentStream;
                    
                    await new Promise((resolve) => {
                        video.onloadedmetadata = () => resolve();
                    });
                    
                    await video.play();
                    isRunning = true;
                    renderLoop();
                    return;
                } catch (e) { console.warn("Versuch fehlgeschlagen", e); }
            }
            alert("Kamera nicht gefunden!");
        }

        async function renderLoop() {
            if (isRunning && video.readyState >= 2 && video.videoWidth > 0) {
                if (activeBg === 'real') {
                    loadingEl.style.display = 'none';
                    canvas.width = video.videoWidth; 
                    canvas.height = video.videoHeight;
                    ctx.save();
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    if (currentFacingMode === 'user') { 
                        ctx.translate(canvas.width, 0); 
                        ctx.scale(-1, 1); 
                    }
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    ctx.restore();
                } else {
                    try {
                        if (!selfieSegmentation) {
                            initMediaPipe();
                        }
                        await selfieSegmentation.send({image: video});
                    } catch (e) {
                        console.error("MediaPipe Processing Fehler:", e);
                    }
                }
            }
            if (isRunning) requestAnimationFrame(renderLoop);
        }

        function onResults(results) {
            loadingEl.style.display = 'none';
            canvas.width = results.image.width; canvas.height = results.image.height;
            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (currentFacingMode === 'user') { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
            
            // Feathering-Effekt: Maske leicht weichzeichnen, um harte Pixelränder und Artefakte zu glätten
            ctx.filter = 'blur(4px)';
            ctx.drawImage(results.segmentationMask, 0, 0, canvas.width, canvas.height);
            ctx.filter = 'none';
            
            ctx.globalCompositeOperation = 'source-in';
            ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);
            ctx.globalCompositeOperation = 'destination-atop';
            const img = bgs[activeBg];
            if (img && img.complete) {
                const cRatio = canvas.width / canvas.height, iRatio = img.width / img.height;
                let dW = canvas.width, dH = canvas.height, dX = 0, dY = 0;
                if (iRatio > cRatio) { dW = canvas.height * iRatio; dX = (canvas.width - dW) / 2; } else { dH = canvas.width / iRatio; dY = (canvas.height - dH) / 2; }
                ctx.drawImage(img, dX, dY, dW, dH);
            } else {
                ctx.fillStyle = "#0f172a"; ctx.fillRect(0,0,canvas.width, canvas.height);
            }
            ctx.restore();
        }

        // --- AKTIONEN ---
        window.startCountdown = () => {
            if (mode === 'collage') {
                isCapturingCollage = true;
                collagePhotos = [];
                captureNextCollagePhoto(1);
            } else {
                isCapturingCollage = false;
                runSingleCountdown();
            }
        };

        function runSingleCountdown() {
            if(window.playSound) window.playSound('click');
            const overlay = document.getElementById('countdown');
            const textEl = document.getElementById('countdown-text');
            overlay.classList.remove('hidden');
            overlay.style.display = 'flex';
            
            let count = 3;
            const tick = () => {
                textEl.innerText = count;
                textEl.classList.remove('animate-pop');
                void textEl.offsetWidth; 
                textEl.classList.add('animate-pop');
                
                if (count === 0) {
                    overlay.classList.add('hidden');
                    overlay.style.display = 'none';
                    window.capturePhoto();
                } else {
                    count--;
                    if(window.playSound && count > 0) window.playSound('click');
                    setTimeout(tick, 1000);
                }
            };
            tick();
        }

        function captureNextCollagePhoto(num) {
            if(window.playSound) window.playSound('click');
            const overlay = document.getElementById('countdown');
            const textEl = document.getElementById('countdown-text');
            overlay.classList.remove('hidden');
            overlay.style.display = 'flex';
            
            let count = 3;
            const tick = () => {
                textEl.innerHTML = `<div class="text-xl md:text-3xl uppercase font-black text-purple-400 mb-2">Bild ${num} von 3</div><div class="text-[5rem] md:text-[8rem] font-black">${count}</div>`;
                textEl.classList.remove('animate-pop');
                void textEl.offsetWidth; 
                textEl.classList.add('animate-pop');
                
                if (count === 0) {
                    if(window.playSound) window.playSound('shutter');
                    
                    // Blitzlicht-Effekt
                    const flash = document.createElement('div');
                    flash.className = 'absolute inset-0 bg-white z-50 transition-opacity duration-300';
                    document.getElementById('video').parentElement.appendChild(flash);
                    setTimeout(() => { flash.style.opacity = 0; setTimeout(() => flash.remove(), 300); }, 50);

                    collagePhotos.push(getFilteredCanvasData());
                    
                    overlay.classList.add('hidden');
                    overlay.style.display = 'none';

                    if (num < 3) {
                        setTimeout(() => {
                            captureNextCollagePhoto(num + 1);
                        }, 1200);
                    } else {
                        isCapturingCollage = false;
                        isRunning = false;
                        generateCollageImage();
                    }
                } else {
                    count--;
                    if(window.playSound && count > 0) window.playSound('click');
                    setTimeout(tick, 1000);
                }
            };
            tick();
        }

        function loadImages(sources) {
            return Promise.all(sources.map(src => new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = src;
            })));
        }

        function drawCroppedImage(ctx, img, dx, dy, dw, dh) {
            const imgRatio = img.width / img.height;
            const targetRatio = dw / dh;
            let sx = 0, sy = 0, sw = img.width, sh = img.height;
            
            if (imgRatio > targetRatio) {
                sw = img.height * targetRatio;
                sx = (img.width - sw) / 2;
            } else {
                sh = img.width / imgRatio;
                sy = (img.height - sh) / 2;
            }
            ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh);
        }

        async function generateCollageImage() {
            const collageCanvas = document.createElement('canvas');
            collageCanvas.width = 1800;
            collageCanvas.height = 1200;
            const cCtx = collageCanvas.getContext('2d');

            try {
                const imgs = await loadImages(collagePhotos);

                const grad = cCtx.createLinearGradient(0, 0, 1800, 1200);
                
                if (activeBg === 'space') { grad.addColorStop(0, '#0f172a'); grad.addColorStop(1, '#1e1b4b'); }
                else if (activeBg === 'jungle') { grad.addColorStop(0, '#064e3b'); grad.addColorStop(1, '#022c22'); }
                else if (activeBg === 'underwater') { grad.addColorStop(0, '#0c4a6e'); grad.addColorStop(1, '#082f49'); }
                else if (activeBg === 'dino') { grad.addColorStop(0, '#7c2d12'); grad.addColorStop(1, '#431407'); }
                else if (activeBg === 'stadion') { grad.addColorStop(0, '#065f46'); grad.addColorStop(1, '#064e3b'); }
                else if (activeBg === 'schloss') { grad.addColorStop(0, '#581c87'); grad.addColorStop(1, '#3b0764'); }
                else if (activeBg === 'paris') { grad.addColorStop(0, '#701a75'); grad.addColorStop(1, '#4a044e'); }
                else if (activeBg === 'wolken') { grad.addColorStop(0, '#0369a1'); grad.addColorStop(1, '#0c4a6e'); }
                else { grad.addColorStop(0, '#1e293b'); grad.addColorStop(1, '#0f172a'); }
                
                cCtx.fillStyle = grad;
                cCtx.fillRect(0, 0, 1800, 1200);

                const drawFrame = (x, y, w, h) => {
                    cCtx.lineWidth = 12;
                    cCtx.strokeStyle = 'white';
                    cCtx.strokeRect(x, y, w, h);
                };

                // Bild 1 (Hauptbild links) - Ausgefüllt über volle Höhe (abzüglich Ränder)
                drawCroppedImage(cCtx, imgs[0], 50, 50, 820, 1100);
                drawFrame(50, 50, 820, 1100);

                // Bild 2 (Rechts oben) - Ausgefüllt
                drawCroppedImage(cCtx, imgs[1], 910, 50, 840, 530);
                drawFrame(910, 50, 840, 530);

                // Bild 3 (Rechts unten) - Ausgefüllt
                drawCroppedImage(cCtx, imgs[2], 910, 620, 840, 530);
                drawFrame(910, 620, 840, 530);

                document.getElementById('preview-img-display').src = collageCanvas.toDataURL('image/png');
                const overlay = document.getElementById('preview-overlay');
                overlay.classList.remove('hidden');
                overlay.style.display = 'flex';

            } catch (err) {
                console.error("Collage-Fehler:", err);
                alert("Fehler beim Erstellen der Collage!");
            }
        }

        window.capturePhoto = () => {
            if(window.playSound) window.playSound('shutter');
            isRunning = false;
            
            if (mode === 'polaroid') {
                generatePolaroidImage();
                return;
            }
            
            document.getElementById('preview-img-display').src = getFilteredCanvasData();
            const overlay = document.getElementById('preview-overlay');
            overlay.classList.remove('hidden');
            overlay.style.display = 'flex';
        };

        window.closePreview = () => {
            if(window.playSound) window.playSound('click');
            const overlay = document.getElementById('preview-overlay');
            overlay.classList.add('hidden');
            overlay.style.display = 'none';

            // Reset collage capturing flags
            isCapturingCollage = false;
            collagePhotos = [];
            updateLiveFilter();

            // Re-initialize if resources were released for printing
            if (activeBg !== 'real' && !selfieSegmentation) {
                initMediaPipe();
            }
            if (!currentStream) {
                initCam(); // This will start the camera and the render loop
            } else {
                isRunning = true; 
                renderLoop();
            }
        };
        window.printFromPreview = (btn) => {
            if(window.playSound) window.playSound('click');
            const jobName = mode === 'polaroid' ? 'Selfie-Polaroid' : 'Selfie';
            if(window.printImage) window.printImage(document.getElementById('preview-img-display').src, jobName, btn);

            // Release resources AFTER calling print to prevent Android from killing the app due to memory pressure.
            console.log("Releasing Magic Selfie resources for printing...");
            isRunning = false;
            if (currentStream) {
                currentStream.getTracks().forEach(t => t.stop());
                currentStream = null;
                video.srcObject = null;
            }
            if (selfieSegmentation) {
                selfieSegmentation.close();
                selfieSegmentation = null;
            }
        };

        window.setBg = (bg, btn) => { 
            activeBg = bg; 
            if(window.playSound) window.playSound('click'); 
            if (btn) {
                document.querySelectorAll('.bg-btn').forEach(b => b.classList.remove('ring-4', 'ring-yellow-400'));
                btn.classList.add('ring-4', 'ring-yellow-400');
            }
            if (bg !== 'real' && !selfieSegmentation) {
                initMediaPipe();
            }
        };

        window.setMode = (m) => {
            mode = m;
            if (window.playSound) window.playSound('click');
            
            const singleBtn = document.getElementById('mode-single-btn');
            const polaroidBtn = document.getElementById('mode-polaroid-btn');
            const collageBtn = document.getElementById('mode-collage-btn');
            
            singleBtn.classList.remove('bg-purple-600', 'text-white');
            singleBtn.classList.add('text-slate-400');
            polaroidBtn.classList.remove('bg-purple-600', 'text-white');
            polaroidBtn.classList.add('text-slate-400');
            collageBtn.classList.remove('bg-purple-600', 'text-white');
            collageBtn.classList.add('text-slate-400');
            
            if (m === 'single') {
                singleBtn.classList.add('bg-purple-600', 'text-white');
                singleBtn.classList.remove('text-slate-400');
            } else if (m === 'polaroid') {
                polaroidBtn.classList.add('bg-purple-600', 'text-white');
                polaroidBtn.classList.remove('text-slate-400');
            } else {
                collageBtn.classList.add('bg-purple-600', 'text-white');
                collageBtn.classList.remove('text-slate-400');
            }
        };

        function getFilterCSS(filterName) {
            switch (filterName) {
                case 'grayscale': return 'grayscale(100%)';
                case 'sepia': return 'sepia(100%)';
                case 'warm': return 'sepia(40%) contrast(110%) saturate(130%)';
                case 'cold': return 'hue-rotate(190deg) saturate(110%)';
                default: return 'none';
            }
        }

        function updateLiveFilter() {
            canvas.style.filter = getFilterCSS(activeFilter);
        }

        function getFilteredCanvasData() {
            if (activeFilter === 'none') {
                return canvas.toDataURL('image/png');
            }
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(canvas, 0, 0);
            
            // Pixel-genaue Filteranwendung für maximale Tablet-Kompatibilität
            applyPixelFilter(tempCtx, tempCanvas.width, tempCanvas.height, activeFilter);
            
            return tempCanvas.toDataURL('image/png');
        }

        function applyPixelFilter(ctx, width, height, filterName) {
            if (filterName === 'none') return;
            try {
                const imgData = ctx.getImageData(0, 0, width, height);
                const data = imgData.data;
                const len = data.length;
                
                if (filterName === 'grayscale') {
                    for (let i = 0; i < len; i += 4) {
                        const r = data[i];
                        const g = data[i + 1];
                        const b = data[i + 2];
                        const gray = 0.299 * r + 0.587 * g + 0.114 * b;
                        data[i] = data[i + 1] = data[i + 2] = gray;
                    }
                } else if (filterName === 'sepia') {
                    for (let i = 0; i < len; i += 4) {
                        const r = data[i];
                        const g = data[i + 1];
                        const b = data[i + 2];
                        data[i]     = Math.min(255, (r * 0.393) + (g * 0.769) + (b * 0.189));
                        data[i + 1] = Math.min(255, (r * 0.349) + (g * 0.686) + (b * 0.168));
                        data[i + 2] = Math.min(255, (r * 0.272) + (g * 0.534) + (b * 0.131));
                    }
                } else if (filterName === 'warm') {
                    for (let i = 0; i < len; i += 4) {
                        const r = data[i];
                        const g = data[i + 1];
                        const b = data[i + 2];
                        data[i]     = Math.min(255, r * 1.15);
                        data[i + 1] = Math.min(255, g * 1.05);
                        data[i + 2] = Math.max(0, b * 0.80);
                    }
                } else if (filterName === 'cold') {
                    for (let i = 0; i < len; i += 4) {
                        const r = data[i];
                        const g = data[i + 1];
                        const b = data[i + 2];
                        data[i]     = Math.max(0, r * 0.80);
                        data[i + 1] = Math.min(255, g * 1.05);
                        data[i + 2] = Math.min(255, b * 1.25);
                    }
                }
                ctx.putImageData(imgData, 0, 0);
            } catch (e) {
                console.error("Fehler beim Anwenden des Pixel-Filters:", e);
            }
        }

        async function generatePolaroidImage() {
            const pCanvas = document.createElement('canvas');
            pCanvas.width = 1200;
            pCanvas.height = 1400;
            const pCtx = pCanvas.getContext('2d');

            try {
                // 1. Draw Polaroid Card Background (Pure white card)
                pCtx.fillStyle = '#ffffff';
                pCtx.fillRect(0, 0, 1200, 1400);

                // 2. Load and draw the captured photo (filtered)
                const photoSrc = getFilteredCanvasData();
                const imgs = await loadImages([photoSrc]);
                const img = imgs[0];

                // Draw cropped square image
                // Image box is: x: 80, y: 80, w: 1040, h: 1040
                drawCroppedImage(pCtx, img, 80, 80, 1040, 1040);

                // 3. Draw a thin border around the image area to separate it from the white frame
                pCtx.lineWidth = 2;
                pCtx.strokeStyle = '#e2e8f0'; // very light gray
                pCtx.strokeRect(80, 80, 1040, 1040);

                // 4. Draw outer border around the Polaroid card to prevent blending with white paper
                pCtx.lineWidth = 6;
                pCtx.strokeStyle = '#d1d5db'; // light-medium gray
                pCtx.strokeRect(3, 3, 1194, 1394);

                // 5. Set preview and open overlay
                document.getElementById('preview-img-display').src = pCanvas.toDataURL('image/png');
                const overlay = document.getElementById('preview-overlay');
                overlay.classList.remove('hidden');
                overlay.style.display = 'flex';

            } catch (err) {
                console.error("Polaroid-Fehler:", err);
                alert("Fehler beim Erstellen des Polaroids!");
            }
        }

        window.setFilter = (f, btn) => {
            activeFilter = f;
            if (window.playSound) window.playSound('click');
            
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            
            updateLiveFilter();
        };
        
        window.switchCamera = () => { 
            if(window.playSound) window.playSound('click'); 
            currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user'; 
            initCam(); 
        };

        setTimeout(initCam, 100); // Bremse entfernt, startet fast sofort
    </script>
</body>
</html>
