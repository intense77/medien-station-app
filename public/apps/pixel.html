<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Pixel Labor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/assets/apple-touch-icon.png?v=2">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="stylesheet" href="../css/style.css">
    <script src="../cordova.js"></script>
    <script src="../js/audio.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/print.js"></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body { 
            height: 100%; 
            width: 100%; 
            margin: 0; 
            padding: 0;
            background-color: #0f172a; 
            color: white; 
            overflow: hidden; 
            user-select: none; 
            -webkit-user-select: none;
            touch-action: none; 
        }
        
        /* Das Gitter - Karierte Zeichenfläche */
        .grid-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1 1 0%;
            min-width: 0;
            min-height: 0;
            width: 100%;
            height: 100%;
            padding: 4px;
            position: relative;
        }

        .pixel-grid { 
            display: grid; 
            grid-template-columns: repeat(16, 1fr); 
            grid-template-rows: repeat(16, 1fr); 
            gap: 1.5px; 
            background: #475569; 
            border: 4px solid #10b981; 
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.7); 
            border-radius: 1.2rem;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            width: min(80vw, 80vh);
            height: min(80vw, 80vh);
            max-width: 100%;
            max-height: 100%;
            flex-shrink: 0;
        }

        @media (min-width: 768px) {
            .pixel-grid { 
                border-width: 6px; 
                gap: 2px;
            }
        }

        /* Karierte Kästchen */
        .cell { 
            background-color: #ffffff; 
            cursor: pointer; 
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            box-shadow: inset 0 0 0 1px rgba(203, 213, 225, 0.6);
            transition: background-color 0.04s ease;
        }

        .cell:active {
            filter: brightness(0.9);
        }

        /* Farb-Buttons */
        .color-btn {
            position: relative;
            cursor: pointer;
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.15s ease;
            touch-action: manipulation;
        }

        .color-btn:active {
            transform: scale(0.92);
        }

        .color-btn.active-color {
            transform: scale(1.12);
            box-shadow: 0 0 0 3.5px #10b981, 0 8px 16px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        @media print {
            body * { visibility: hidden; }
            #print-container, #print-container * { visibility: visible; }
            #print-container {
                position: fixed; left: 0; top: 0; width: 100%; height: 100%;
                display: flex !important; align-items: center; justify-content: center;
                background: white; z-index: 99999;
            }
            #print-img {
                max-width: 90%; max-height: 90%; object-fit: contain;
                border: 4px solid black;
                image-rendering: pixelated;
            }
        }
    </style>
</head>
<body class="flex flex-col p-2 md:p-4 box-border bg-slate-900 overflow-hidden h-full w-full">

    <!-- HEADER ZEILE (Menü, Titel, Hilfe) -->
    <header class="header-area h-14 md:h-20 flex-none shrink-0 flex justify-between items-center z-50 mb-1 md:mb-3 px-1 relative">
        <button onclick="window.goHome()" class="bg-slate-800 text-white border-2 md:border-4 border-slate-600 hover:border-white px-3 py-1.5 md:px-6 md:py-3 rounded-full text-xs md:text-xl font-black shadow-xl flex items-center gap-1.5 md:gap-3 transition-transform active:scale-95 no-underline focus:outline-none shrink-0 z-50">
            🏠 <span class="hidden sm:inline">MENÜ</span>
        </button>

        <h1 class="absolute left-1/2 -translate-x-1/2 top-1/2 -translate-y-1/2 text-xl sm:text-2xl md:text-4xl font-black text-emerald-400 font-mono tracking-wider drop-shadow-lg pointer-events-none flex items-center gap-2">
            <span>👾</span> <span>PIXEL LABOR</span>
        </h1>
        
        <button onclick="window.toggleInfo()" class="w-10 h-10 md:w-14 md:h-14 bg-slate-800 text-white rounded-full font-bold border-2 md:border-4 border-slate-600 hover:border-white shadow-xl flex items-center justify-center transition-transform active:scale-95 text-lg md:text-2xl shrink-0 z-50">
            ?
        </button>
    </header>

    <!-- HAUPT-BEREICH -->
    <main class="flex-1 flex flex-col md:flex-row landscape:flex-row items-center justify-center gap-2 md:gap-4 min-h-0 min-w-0 w-full max-w-[95rem] mx-auto pb-1">
        
        <!-- Das Gitter (Karierte Zeichenfläche) -->
        <div class="grid-wrapper">
            <div id="grid" class="pixel-grid">
                <!-- 16x16 = 256 Zellen via JS -->
            </div>
        </div>

        <!-- Werkzeugleiste (Passt perfekt in Hoch- und Querformat) -->
        <aside class="bg-slate-800/95 backdrop-blur-md p-2 sm:p-3 md:p-4 rounded-2xl md:rounded-[2rem] border-2 md:border-4 border-slate-700 flex flex-col justify-between gap-2 md:gap-3 shadow-2xl w-full md:w-56 lg:w-64 landscape:w-56 md:landscape:w-64 h-auto md:h-full landscape:h-full shrink-0 overflow-hidden">
            
            <!-- Farb-Palette (12 kindgerechte Farben inkl. Radierer) -->
            <div class="grid grid-cols-6 md:grid-cols-3 landscape:grid-cols-4 md:landscape:grid-cols-3 gap-1.5 sm:gap-2 md:gap-3 justify-items-center items-center w-full shrink-0" id="palette">
                <!-- Schwarz & Weiß -->
                <div class="color-btn active-color shrink-0 w-8 h-8 sm:w-10 sm:h-10 md:w-12 md:h-12 rounded-xl bg-black border-2 border-slate-600 shadow-md" data-color="#000000" onclick="setColor(this)" title="Schwarz"></div>
                <div class="color-btn shrink-0 w-8 h-8 sm:w-10 sm:h-10 md:w-12 md:h-12 rounded-xl bg-white border-2 border-slate-400 shadow-md" data-color="#ffffff" onclick="setColor(this)" title="Weiß"></div>
                
                <!-- Bunte Farben -->
                <div class="color-btn shrink-0 w-8 h-8 sm:w-10 sm:h-10 md:w-12 md:h-12 rounded-xl bg-red-500 border-2 border-red-700 shadow-md" data-color="#ef4444" onclick="setColor(this)" title="Rot"></div>
                <div class="color-btn shrink-0 w-8 h-8 sm:w-10 sm:h-10 md:w-12 md:h-12 rounded-xl bg-orange-500 border-2 border-orange-700 shadow-md" data-color="#f97316" onclick="setColor(this)" title="Orange"></div>
                <div class="color-btn shrink-0 w-8 h-8 sm:w-10 sm:h-10 md:w-12 md:h-12 rounded-xl bg-yellow-400 border-2 border-yellow-600 shadow-md" data-color="#facc15" onclick="setColor(this)" title="Gelb"></div>
                <div class="color-btn shrink-0 w-8 h-8 sm:w-10 sm:h-10 md:w-12 md:h-12 rounded-xl bg-emerald-500 border-2 border-emerald-700 shadow-md" data-color="#10b981" onclick="setColor(this)" title="Grün"></div>
                <div class="color-btn shrink-0 w-8 h-8 sm:w-10 sm:h-10 md:w-12 md:h-12 rounded-xl bg-cyan-400 border-2 border-cyan-600 shadow-md" data-color="#06b6d4" onclick="setColor(this)" title="Cyan / Türkis"></div>
                <div class="color-btn shrink-0 w-8 h-8 sm:w-10 sm:h-10 md:w-12 md:h-12 rounded-xl bg-blue-500 border-2 border-blue-700 shadow-md" data-color="#3b82f6" onclick="setColor(this)" title="Blau"></div>
                <div class="color-btn shrink-0 w-8 h-8 sm:w-10 sm:h-10 md:w-12 md:h-12 rounded-xl bg-purple-500 border-2 border-purple-700 shadow-md" data-color="#a855f7" onclick="setColor(this)" title="Lila"></div>
                <div class="color-btn shrink-0 w-8 h-8 sm:w-10 sm:h-10 md:w-12 md:h-12 rounded-xl bg-pink-500 border-2 border-pink-700 shadow-md" data-color="#ec4899" onclick="setColor(this)" title="Pink"></div>
                <div class="color-btn shrink-0 w-8 h-8 sm:w-10 sm:h-10 md:w-12 md:h-12 rounded-xl bg-amber-800 border-2 border-amber-950 shadow-md" data-color="#78350f" onclick="setColor(this)" title="Braun"></div>
                
                <!-- Radierer -->
                <div class="color-btn shrink-0 w-8 h-8 sm:w-10 sm:h-10 md:w-12 md:h-12 rounded-xl bg-slate-700 border-2 border-slate-500 flex items-center justify-center text-sm sm:text-base md:text-2xl shadow-md" data-color="#ffffff" onclick="setColor(this)" title="Radierer">🧽</div>
            </div>

            <!-- Trenner -->
            <div class="h-0.5 w-full bg-slate-700 my-0.5 hidden md:block landscape:block rounded-full shrink-0"></div>

            <!-- Aktionen -->
            <div class="flex flex-row md:flex-col landscape:flex-col gap-1.5 md:gap-2.5 w-full shrink-0 justify-center">
                <button onclick="undo()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-100 py-1.5 sm:py-2 md:py-2.5 px-2 rounded-xl font-black text-xs sm:text-sm md:text-base shadow-md active:translate-y-0.5 transition border-b-2 md:border-b-4 border-slate-900 active:border-b-0 flex items-center justify-center gap-1.5" title="Schritt zurück">
                    <span class="text-sm md:text-lg">↩️</span> <span>ZURÜCK</span>
                </button>
                <button onclick="saveArt(this)" class="flex-1 bg-amber-400 text-slate-950 hover:bg-amber-300 py-1.5 sm:py-2 md:py-2.5 px-2 rounded-xl font-black text-xs sm:text-sm md:text-base shadow-md active:translate-y-0.5 transition border-b-2 md:border-b-4 border-amber-600 active:border-b-0 flex items-center justify-center gap-1.5" title="In Galerie speichern">
                    <span class="text-sm md:text-lg">💾</span> <span>SPEICHERN</span>
                </button>
                <button onclick="printArt(this)" class="flex-1 bg-white text-emerald-900 hover:bg-gray-100 py-1.5 sm:py-2 md:py-2.5 px-2 rounded-xl font-black text-xs sm:text-sm md:text-base shadow-md active:translate-y-0.5 transition border-b-2 md:border-b-4 border-gray-300 active:border-b-0 flex items-center justify-center gap-1.5" title="Pixel Bild ausdrucken">
                    <span class="text-sm md:text-lg">🖨️</span> <span>DRUCK</span>
                </button>
                <button onclick="confirmClearGrid()" class="flex-1 bg-red-950/80 hover:bg-red-900 text-red-200 py-1.5 sm:py-2 md:py-2.5 px-2 rounded-xl font-black text-xs sm:text-sm md:text-base shadow-md active:translate-y-0.5 transition border-b-2 md:border-b-4 border-red-950 active:border-b-0 flex items-center justify-center gap-1.5" title="Gitter komplett leeren">
                    <span class="text-sm md:text-lg">🧹</span> <span>LÖSCHEN</span>
                </button>
            </div>
        </aside>
    </main>

    <!-- HILFE MODAL -->
    <div id="info-modal" class="hidden fixed inset-0 z-[200] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4" onclick="window.toggleInfo()">
        <div class="bg-slate-800 border-4 border-emerald-500 rounded-[2rem] max-w-3xl w-full p-6 md:p-8 shadow-2xl relative" onclick="event.stopPropagation()">
            <button onclick="window.toggleInfo()" class="absolute top-5 right-5 text-white hover:text-emerald-400 text-3xl md:text-4xl font-bold transition">✖</button>
            
            <h2 class="text-2xl md:text-4xl font-black text-white mb-6 md:mb-8 border-b border-slate-600 pb-4 flex items-center gap-3 md:gap-4">
                <span class="text-4xl md:text-6xl">👾</span> <span>ANLEITUNG</span>
                <button onclick="window.speakText('Anleitung für das Pixel Labor. Pixel sind kleine bunte Quadrate, aus denen jedes digitale Bild besteht! Malen: Wähle eine Farbe aus und tippe oder wische über das Gitter. Radieren: Nimm den Schwamm oder drücke auf Zurück. Fertig? Speichere dein Bild für die Galerie oder drucke es aus.', event)" class="ml-auto mr-10 md:mr-14 bg-slate-700 hover:bg-slate-600 text-white rounded-full w-10 h-10 md:w-14 md:h-14 flex items-center justify-center shadow-lg border-2 border-slate-500 active:scale-95 transition-all text-xl md:text-3xl shrink-0" title="Vorlesen">🔊</button>
            </h2>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6 text-sm md:text-base">
                <div class="p-4 md:p-6 bg-slate-700/50 rounded-2xl border border-slate-600 flex flex-col items-center text-center">
                    <div class="text-3xl md:text-4xl mb-3">🎨</div>
                    <h3 class="text-emerald-400 font-bold text-lg md:text-xl mb-1 md:mb-2">1. Malen</h3>
                    <p class="text-slate-300 leading-snug">Wähle eine <b>Farbe</b> und tippe oder wische über die Quadrate.</p>
                </div>
                
                <div class="p-4 md:p-6 bg-slate-700/50 rounded-2xl border border-slate-600 flex flex-col items-center text-center">
                    <div class="text-3xl md:text-4xl mb-3">🧽</div>
                    <h3 class="text-white font-bold text-lg md:text-xl mb-1 md:mb-2">2. Ausbessern</h3>
                    <p class="text-slate-300 leading-snug">Mit dem <b>Schwamm</b> radieren oder mit <b>ZURÜCK</b> den letzten Schritt rückgängig machen.</p>
                </div>

                <div class="p-4 md:p-6 bg-slate-700/50 rounded-2xl border border-slate-600 flex flex-col items-center text-center">
                    <div class="text-3xl md:text-4xl mb-3">💾</div>
                    <h3 class="text-amber-300 font-bold text-lg md:text-xl mb-1 md:mb-2">3. Kunstwerk</h3>
                    <p class="text-slate-300 leading-snug">Speichere dein Pixel-Bild in den <b>Meisterwerken</b> oder drucke es aus!</p>
                </div>
            </div>
            
            <button onclick="window.toggleInfo()" class="mt-6 md:mt-8 w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3 md:py-4 rounded-xl text-lg md:text-xl shadow-xl transition active:scale-98">
                ALLES KLAR!
            </button>
        </div>
    </div>

    <!-- Versteckter Container für den Druck -->
    <div id="print-container" class="hidden">
        <img id="print-img" src="" alt="Druckvorschau">
    </div>

    <script>
        const grid = document.getElementById('grid');
        const gridWrapper = document.querySelector('.grid-wrapper');
        let currentColor = '#000000';
        let isDrawing = false;
        const historyStack = [];
        const MAX_HISTORY = 20;

        // Pixel-Größe dynamisch an den Bildschirm anpassen
        function updateGridDimensions() {
            if (!gridWrapper || !grid) return;
            const w = gridWrapper.clientWidth - 16;
            const h = gridWrapper.clientHeight - 16;
            if (w <= 0 || h <= 0) return;
            const size = Math.floor(Math.min(w, h));
            if (size > 50) {
                grid.style.width = size + 'px';
                grid.style.height = size + 'px';
            }
        }

        if (window.ResizeObserver) {
            const ro = new ResizeObserver(() => updateGridDimensions());
            ro.observe(gridWrapper);
        }
        window.addEventListener('resize', updateGridDimensions);
        window.addEventListener('orientationchange', () => setTimeout(updateGridDimensions, 100));

        // Web Audio Synthesizer für spielerischen 8-Bit-Ton beim Malen
        let audioCtx = null;
        function playPixelBlip(pitch = 520) {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(pitch, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(pitch * 1.3, audioCtx.currentTime + 0.04);
                
                gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } catch (e) {}
        }

        // Snapshot des Rasters für Undo sichern
        function saveSnapshot() {
            const cells = document.querySelectorAll('.cell');
            const state = Array.from(cells).map(c => c.style.backgroundColor || '#ffffff');
            historyStack.push(state);
            if (historyStack.length > MAX_HISTORY) {
                historyStack.shift();
            }
        }

        function undo() {
            if (window.playSound) window.playSound('click');
            if (historyStack.length === 0) return;
            const previousState = historyStack.pop();
            const cells = document.querySelectorAll('.cell');
            cells.forEach((cell, i) => {
                if (previousState[i]) {
                    cell.style.backgroundColor = previousState[i];
                }
            });
            playPixelBlip(380);
        }

        // Zelle bemalen
        function paintCell(cell) {
            if (!cell || !cell.classList.contains('cell')) return;
            const prevColor = cell.style.backgroundColor || '#ffffff';
            if (prevColor !== currentColor) {
                cell.style.backgroundColor = currentColor;
                playPixelBlip(currentColor === '#ffffff' ? 360 : 540);
            }
        }

        // Grid bauen (16x16 = 256 Zellen)
        function initGrid() {
            const frag = document.createDocumentFragment();
            for (let i = 0; i < 256; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.index = i;
                cell.style.backgroundColor = '#ffffff';

                // Direkte Listener auf jeder Zelle
                cell.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    isDrawing = true;
                    saveSnapshot();
                    paintCell(cell);
                });
                cell.addEventListener('mouseenter', () => {
                    if (isDrawing) paintCell(cell);
                });

                frag.appendChild(cell);
            }
            grid.innerHTML = ''; 
            grid.appendChild(frag);
            updateGridDimensions();
        }

        // Pointer & Touch Events am Grid
        grid.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            isDrawing = true;
            saveSnapshot();
            const target = e.target.closest('.cell') || document.elementFromPoint(e.clientX, e.clientY)?.closest('.cell');
            if (target) paintCell(target);
        });

        grid.addEventListener('pointermove', (e) => {
            if (!isDrawing && e.buttons !== 1) return;
            e.preventDefault();
            const target = document.elementFromPoint(e.clientX, e.clientY)?.closest('.cell');
            if (target) paintCell(target);
        });

        grid.addEventListener('touchmove', (e) => {
            if (!isDrawing) return;
            e.preventDefault();
            const t = e.touches[0];
            if (t) {
                const target = document.elementFromPoint(t.clientX, t.clientY)?.closest('.cell');
                if (target) paintCell(target);
            }
        }, { passive: false });

        window.addEventListener('pointerup', () => { isDrawing = false; });
        window.addEventListener('pointercancel', () => { isDrawing = false; });
        window.addEventListener('mouseup', () => { isDrawing = false; });
        window.addEventListener('touchend', () => { isDrawing = false; });

        function setColor(btn) {
            if (window.playSound) window.playSound('click');
            currentColor = btn.getAttribute('data-color');
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active-color'));
            btn.classList.add('active-color');
        }

        function confirmClearGrid() {
            if (window.playSound) window.playSound('click');
            const doClear = () => {
                saveSnapshot();
                document.querySelectorAll('.cell').forEach(c => c.style.backgroundColor = '#ffffff');
                playPixelBlip(320);
            };

            if (window.showConfirm) {
                window.showConfirm("Möchtest du dein Pixel-Bild wirklich löschen?", doClear, "🧹");
            } else if (confirm("Möchtest du dein Pixel-Bild wirklich löschen?")) {
                doClear();
            }
        }

        function generateCanvas() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const size = 32; 
            canvas.width = 16 * size;
            canvas.height = 16 * size;
            const cells = document.querySelectorAll('.cell');
            cells.forEach((cell, i) => {
                const x = (i % 16) * size;
                const y = Math.floor(i / 16) * size;
                const color = cell.style.backgroundColor || '#ffffff';
                ctx.fillStyle = color;
                ctx.fillRect(x, y, size, size);
            });
            return canvas;
        }

        function saveArt(btn) {
            if (window.playSound) window.playSound('click');
            const canvas = generateCanvas();
            const dataUrl = canvas.toDataURL('image/png');
            if (window.saveToMeisterwerke) {
                window.saveToMeisterwerke({
                    type: 'image',
                    appName: 'Pixel Art',
                    title: 'Pixel Bild',
                    dataUrl: dataUrl
                });
            }
            if (window.playSound) window.playSound('success');
            if (window.triggerCelebration) window.triggerCelebration();

            if (btn) {
                const origHtml = btn.innerHTML;
                btn.innerHTML = '<span>🌟</span> <span>GESPEICHERT!</span>';
                setTimeout(() => { btn.innerHTML = origHtml; }, 2200);
            }
        }

        function printArt(btn) {
            if (window.playSound) window.playSound('click');
            const canvas = generateCanvas();
            const dataUrl = canvas.toDataURL();
            if (window.saveToMeisterwerke) {
                window.saveToMeisterwerke({ type: 'image', appName: 'Pixel Art', title: 'Pixel Bild', dataUrl: dataUrl });
            }
            if (window.printImage) {
                window.printImage(dataUrl, 'Pixel', btn);
            } else {
                const printImg = document.getElementById('print-img');
                printImg.src = dataUrl;
                setTimeout(() => { window.print(); }, 100);
            }
        }

        // Initialisierung
        initGrid();
        setTimeout(updateGridDimensions, 50);
        setTimeout(updateGridDimensions, 250);
    </script>
</body>
</html>
